max_agents: 10
local_radius: 5
max_steps_factor: 4
obstacle_density: 0.15
base_seed: 42

d_pheromone: 5
d_comm: 10
tau_pheromone: 0.95

reward_new_cell: 1.0
reward_step: -1.0
cooperative_factor: 0.25
idle_threshold: 8

gamma: 0.99
tau: 0.01
lr_agent: 5.0e-4
lr_mixer: 1.0e-3
weight_decay: 1.0e-5
temperature: 1.0
noisy_sigma_init: 0.3

max_episodes_in_buffer: 200
sequence_length: 16
min_episodes_before_training: 100
batch_size: 16

warmup_episodes: 50
prioritized_updates: 50
prioritized_alpha: 2.0
chi: 0.5

stages:
  - [4, 4, 500]
  - [6, 6, 800]
  - [8, 8, 1200]
  - [10, 10, 1600]
  - [12, 12, 2000]
  - [15, 15, 2500]
  - [18, 18, 3000]

target_coverage: 0.96
streak_for_early_stop: 8
eval_freq: 5

final_tests: [20, 25, 28, 30, 35, 40]
agent_counts_for_tests: [1, 3, 5, 8, 10]

agent_hidden_size: 512
gru_hidden_size: 128
node_feat_dim: 1056

checkpoint_dir: "checkpoints"
best_model_name: "best_ctde.pt"
video_dir: "videos"

rollback_patience: 40
max_rollbacks: 3
prioritized_alpha_final: 0.3

test_max_steps_factor: 8
failure_agent_counts: [3, 5, 8, 10]

num_servers: 3
server_placement: "fixed"

survival_policy: rl    # or 'bfs'

worker_local_radius: 2    # 5x5 window (2*2 + 1)
server_local_radius: 5    # 10x10 window (5*2 + 1)

battery_capacity: 1000
energy_move: 1.0
energy_stay: 0.5
energy_penalty: 0.01     # negative reward per energy unit